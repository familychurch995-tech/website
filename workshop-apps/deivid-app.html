<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças - Controle Total</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            z-index: -2;
        }

        .gradient-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .blob1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            top: -200px;
            left: -200px;
        }

        .blob2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            bottom: -200px;
            right: -200px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 0 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .card-title {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .balance { color: #667eea; }
        .income { color: #00ff88; }
        .expense { color: #ff3366; }

        .add-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-income {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
        }

        .btn-expense {
            background: linear-gradient(135deg, #ff3366 0%, #ff1744 100%);
            color: #fff;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .transactions {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .transactions h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .transaction-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .transaction-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-desc {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .transaction-date {
            font-size: 0.85rem;
            color: #666;
        }

        .transaction-amount {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
            
            .card-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="gradient-blob blob1"></div>
    <div class="gradient-blob blob2"></div>
    
    <div class="container">
        <header>
            <h1>Minhas Finanças</h1>
            <p class="subtitle">Controle total do seu dinheiro</p>
        </header>
        
        <div class="dashboard">
            <div class="card">
                <div class="card-title">Saldo Atual</div>
                <div class="card-value balance" id="balance">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-title">Entradas do Mês</div>
                <div class="card-value income" id="monthIncome">R$ 0,00</div>
            </div>
            <div class="card">
                <div class="card-title">Saídas do Mês</div>
                <div class="card-value expense" id="monthExpense">R$ 0,00</div>
            </div>
        </div>
        
        <div class="add-section">
            <h2 style="margin-bottom: 25px;">Nova Transação</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" placeholder="Ex: Salário, Mercado, Aluguel..." required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Valor</label>
                    <input type="number" id="amount" step="0.01" placeholder="0,00" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Categoria</label>
                    <select id="category">
                        <option value="salario">Salário</option>
                        <option value="freelance">Freelance</option>
                        <option value="alimentacao">Alimentação</option>
                        <option value="transporte">Transporte</option>
                        <option value="moradia">Moradia</option>
                        <option value="lazer">Lazer</option>
                        <option value="saude">Saúde</option>
                        <option value="educacao">Educação</option>
                        <option value="dizimo">Dízimo/Ofertas</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>
                
                <div class="button-group">
                    <button type="button" class="btn-income" onclick="addTransaction('income')">
                        + Adicionar Entrada
                    </button>
                    <button type="button" class="btn-expense" onclick="addTransaction('expense')">
                        - Adicionar Saída
                    </button>
                </div>
            </form>
        </div>
        
        <div class="transactions">
            <h2>Últimas Transações</h2>
            <div class="transaction-list" id="transactionList">
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <p>Nenhuma transação ainda.<br>Comece adicionando suas entradas e saídas!</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Recuperar dados do localStorage
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        
        // Atualizar dashboard ao carregar
        updateDashboard();
        renderTransactions();
        
        function addTransaction(type) {
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            
            if (!description || !amount || amount <= 0) {
                alert('Por favor, preencha todos os campos corretamente!');
                return;
            }
            
            const transaction = {
                id: Date.now(),
                description,
                amount: type === 'expense' ? -amount : amount,
                category,
                type,
                date: new Date().toISOString()
            };
            
            transactions.unshift(transaction);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            
            // Limpar formulário
            document.getElementById('transactionForm').reset();
            
            // Atualizar interface
            updateDashboard();
            renderTransactions();
        }
        
        function updateDashboard() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            let balance = 0;
            let monthIncome = 0;
            let monthExpense = 0;
            
            transactions.forEach(transaction => {
                const transDate = new Date(transaction.date);
                balance += transaction.amount;
                
                if (transDate.getMonth() === currentMonth && transDate.getFullYear() === currentYear) {
                    if (transaction.type === 'income') {
                        monthIncome += transaction.amount;
                    } else {
                        monthExpense += Math.abs(transaction.amount);
                    }
                }
            });
            
            document.getElementById('balance').textContent = formatCurrency(balance);
            document.getElementById('monthIncome').textContent = formatCurrency(monthIncome);
            document.getElementById('monthExpense').textContent = formatCurrency(monthExpense);
        }
        
        function renderTransactions() {
            const container = document.getElementById('transactionList');
            
            if (transactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <p>Nenhuma transação ainda.<br>Comece adicionando suas entradas e saídas!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = transactions.slice(0, 10).map(transaction => `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <div class="transaction-desc">${transaction.description}</div>
                        <div class="transaction-date">${formatDate(transaction.date)} • ${getCategoryName(transaction.category)}</div>
                    </div>
                    <div class="transaction-amount ${transaction.type}">
                        ${transaction.type === 'income' ? '+' : ''}${formatCurrency(transaction.amount)}
                    </div>
                </div>
            `).join('');
        }
        
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }
        
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function getCategoryName(category) {
            const categories = {
                'salario': 'Salário',
                'freelance': 'Freelance',
                'alimentacao': 'Alimentação',
                'transporte': 'Transporte',
                'moradia': 'Moradia',
                'lazer': 'Lazer',
                'saude': 'Saúde',
                'educacao': 'Educação',
                'dizimo': 'Dízimo/Ofertas',
                'outros': 'Outros'
            };
            return categories[category] || category;
        }
    </script>
</body>
</html>
