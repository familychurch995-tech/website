<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limosine Premium - Gestão de Viagens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #ffd700;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 15px;
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            font-weight: 600;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .booking-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .booking-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,215,0,0.3);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .client-name {
            font-size: 20px;
            font-weight: 600;
        }

        .booking-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: rgba(255,193,7,0.2);
            color: #ffc107;
        }

        .status-confirmed {
            background: rgba(40,167,69,0.2);
            color: #28a745;
        }

        .status-completed {
            background: rgba(108,117,125,0.2);
            color: #6c757d;
        }

        .booking-details {
            display: grid;
            gap: 10px;
            color: #ccc;
            font-size: 14px;
        }

        .detail-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .detail-icon {
            width: 20px;
            color: #ffd700;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            border: none;
            border-radius: 50%;
            font-size: 30px;
            color: #000;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,215,0,0.3);
            transition: all 0.3s ease;
        }

        .fab:hover {
            transform: scale(1.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            max-width: 500px;
            margin: 20px auto;
            padding: 30px;
            position: relative;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .modal-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255,255,255,0.08);
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: #666;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #ffd700;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,215,0,0.3);
            background: transparent;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(255,215,0,0.1);
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 28px;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                🚗 Limosine Premium
            </div>
            <div class="subtitle">Gestão de Viagens Exclusivas</div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">Viagens Hoje</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="weekCount">0</div>
                <div class="stat-label">Esta Semana</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="monthCount">0</div>
                <div class="stat-label">Este Mês</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pendentes</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('upcoming')">Próximas</button>
            <button class="tab" onclick="showTab('today')">Hoje</button>
            <button class="tab" onclick="showTab('history')">Histórico</button>
        </div>

        <div class="content active" id="upcoming">
            <div class="booking-list" id="upcomingList">
                <div class="empty-state">
                    <div class="empty-state-icon">📅</div>
                    <p>Nenhuma viagem agendada</p>
                    <p style="margin-top: 10px; font-size: 14px; color: #555;">Clique no + para agendar uma nova viagem</p>
                </div>
            </div>
        </div>

        <div class="content" id="today">
            <div class="booking-list" id="todayList">
                <div class="empty-state">
                    <div class="empty-state-icon">🚗</div>
                    <p>Nenhuma viagem para hoje</p>
                </div>
            </div>
        </div>

        <div class="content" id="history">
            <div class="booking-list" id="historyList">
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>Histórico vazio</p>
                </div>
            </div>
        </div>

        <button class="fab" onclick="showModal()">+</button>
    </div>

    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 class="modal-header">Nova Reserva</h2>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label class="form-label">Nome do Cliente</label>
                    <input type="text" class="form-input" id="clientName" required placeholder="Digite o nome completo">
                </div>

                <div class="form-group">
                    <label class="form-label">Telefone</label>
                    <input type="tel" class="form-input" id="clientPhone" placeholder="(11) 99999-9999">
                </div>

                <div class="form-group">
                    <label class="form-label">Data da Viagem</label>
                    <input type="date" class="form-input" id="tripDate" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Horário de Pickup</label>
                    <input type="time" class="form-input" id="pickupTime" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Local de Pickup</label>
                    <input type="text" class="form-input" id="pickupLocation" required placeholder="Endereço completo">
                </div>

                <div class="form-group">
                    <label class="form-label">Destino</label>
                    <input type="text" class="form-input" id="destination" required placeholder="Endereço de destino">
                </div>

                <div class="form-group">
                    <label class="form-label">Forma de Pagamento</label>
                    <select class="form-select" id="paymentMethod" required>
                        <option value="">Selecione...</option>
                        <option value="cash">Dinheiro</option>
                        <option value="pix">PIX</option>
                        <option value="credit">Cartão de Crédito</option>
                        <option value="debit">Cartão de Débito</option>
                        <option value="transfer">Transferência</option>
                        <option value="invoice">Faturado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Observações</label>
                    <input type="text" class="form-input" id="notes" placeholder="Informações adicionais">
                </div>

                <div class="form-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let bookings = JSON.parse(localStorage.getItem('limoBookings')) || [];
        let currentTab = 'upcoming';

        function saveBookings() {
            localStorage.setItem('limoBookings', JSON.stringify(bookings));
        }

        function generateId() {
            return Date.now().toString();
        }

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
            
            updateDisplay();
        }

        function showModal() {
            document.getElementById('bookingModal').style.display = 'block';
            document.getElementById('tripDate').min = new Date().toISOString().split('T')[0];
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
            document.getElementById('bookingForm').reset();
        }

        function formatDate(dateString) {
            const date = new Date(dateString + 'T00:00:00');
            return date.toLocaleDateString('pt-BR');
        }

        function formatPhone(phone) {
            return phone.replace(/\D/g, '').replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
        }

        function getPaymentLabel(method) {
            const labels = {
                cash: 'Dinheiro',
                pix: 'PIX',
                credit: 'Cartão de Crédito',
                debit: 'Cartão de Débito',
                transfer: 'Transferência',
                invoice: 'Faturado'
            };
            return labels[method] || method;
        }

        function getStatusLabel(status) {
            const labels = {
                pending: 'Pendente',
                confirmed: 'Confirmada',
                completed: 'Concluída',
                cancelled: 'Cancelada'
            };
            return labels[status] || status;
        }

        function renderBooking(booking) {
            return `
                <div class="booking-card">
                    <div class="booking-header">
                        <div class="client-name">${booking.clientName}</div>
                        <div class="booking-status status-${booking.status}">${getStatusLabel(booking.status)}</div>
                    </div>
                    <div class="booking-details">
                        <div class="detail-row">
                            <span class="detail-icon">📅</span>
                            <span>${formatDate(booking.tripDate)} às ${booking.pickupTime}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-icon">📍</span>
                            <span>${booking.pickupLocation}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-icon">🎯</span>
                            <span>${booking.destination}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-icon">📞</span>
                            <span>${booking.clientPhone}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-icon">💳</span>
                            <span>${getPaymentLabel(booking.paymentMethod)}</span>
                        </div>
                        ${booking.notes ? `
                        <div class="detail-row">
                            <span class="detail-icon">📝</span>
                            <span>${booking.notes}</span>
                        </div>
                        ` : ''}
                    </div>
                    <div class="action-buttons">
                        ${booking.status === 'pending' ? `
                            <button class="action-btn" onclick="updateStatus('${booking.id}', 'confirmed')">Confirmar</button>
                        ` : ''}
                        ${booking.status === 'confirmed' ? `
                            <button class="action-btn" onclick="updateStatus('${booking.id}', 'completed')">Concluir</button>
                        ` : ''}
                        ${booking.status !== 'completed' && booking.status !== 'cancelled' ? `
                            <button class="action-btn" onclick="updateStatus('${booking.id}', 'cancelled')">Cancelar</button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function updateStatus(bookingId, newStatus) {
            const booking = bookings.find(b => b.id === bookingId);
            if (booking) {
                booking.status = newStatus;
                saveBookings();
                updateDisplay();
                updateStats();
            }
        }

        function updateDisplay() {
            const today = new Date().toISOString().split('T')[0];
            
            const upcomingBookings = bookings.filter(b => 
                b.tripDate >= today && 
                (b.status === 'pending' || b.status === 'confirmed')
            ).sort((a, b) => new Date(a.tripDate + ' ' + a.pickupTime) - new Date(b.tripDate + ' ' + b.pickupTime));

            const todayBookings = bookings.filter(b => 
                b.tripDate === today
            ).sort((a, b) => a.pickupTime.localeCompare(b.pickupTime));

            const historyBookings = bookings.filter(b => 
                b.status === 'completed' || b.status === 'cancelled' || b.tripDate < today
            ).sort((a, b) => new Date(b.tripDate) - new Date(a.tripDate));

            // Renderizar listas
            const upcomingList = document.getElementById('upcomingList');
            if (upcomingBookings.length === 0) {
                upcomingList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📅</div>
                        <p>Nenhuma viagem agendada</p>
                        <p style="margin-top: 10px; font-size: 14px; color: #555;">Clique no + para agendar uma nova viagem</p>
                    </div>
                `;
            } else {
                upcomingList.innerHTML = upcomingBookings.map(renderBooking).join('');
            }

            const todayList = document.getElementById('todayList');
            if (todayBookings.length === 0) {
                todayList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🚗</div>
                        <p>Nenhuma viagem para hoje</p>
                    </div>
                `;
            } else {
                todayList.innerHTML = todayBookings.map(renderBooking).join('');
            }

            const historyList = document.getElementById('historyList');
            if (historyBookings.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Histórico vazio</p>
                    </div>
                `;
            } else {
                historyList.innerHTML = historyBookings.map(renderBooking).join('');
            }
        }

        function updateStats() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            // Calcular início da semana (domingo)
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - today.getDay());
            
            // Calcular início do mês
            const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

            const todayCount = bookings.filter(b => b.tripDate === todayStr && b.status !== 'cancelled').length;
            const weekCount = bookings.filter(b => {
                const bookingDate = new Date(b.tripDate);
                return bookingDate >= weekStart && bookingDate <= today && b.status !== 'cancelled';
            }).length;
            const monthCount = bookings.filter(b => {
                const bookingDate = new Date(b.tripDate);
                return bookingDate >= monthStart && bookingDate <= today && b.status !== 'cancelled';
            }).length;
            const pendingCount = bookings.filter(b => b.status === 'pending').length;

            document.getElementById('todayCount').textContent = todayCount;
            document.getElementById('weekCount').textContent = weekCount;
            document.getElementById('monthCount').textContent = monthCount;
            document.getElementById('pendingCount').textContent = pendingCount;
        }

        // Event Listeners
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const booking = {
                id: generateId(),
                clientName: document.getElementById('clientName').value,
                clientPhone: document.getElementById('clientPhone').value,
                tripDate: document.getElementById('tripDate').value,
                pickupTime: document.getElementById('pickupTime').value,
                pickupLocation: document.getElementById('pickupLocation').value,
                destination: document.getElementById('destination').value,
                paymentMethod: document.getElementById('paymentMethod').value,
                notes: document.getElementById('notes').value,
                status: 'pending',
                createdAt: new Date().toISOString()
            };

            bookings.push(booking);
            saveBookings();
            updateDisplay();
            updateStats();
            closeModal();
        });

        // Formatar telefone enquanto digita
        document.getElementById('clientPhone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
                e.target.value = value;
            }
        });

        // Fechar modal ao clicar fora
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        }

        // Inicializar
        updateDisplay();
        updateStats();
    </script>
</body>
</html>
