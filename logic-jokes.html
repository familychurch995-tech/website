<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lógica de Programação com Piadas | Dons Digitais — Family Church</title>
  <meta name="description" content="Aprenda lógica de programação de forma divertida com piadas interativas. Parte do Workshop Dons Digitais — Family Church." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0A0A0F;
      color: #F5F0E8;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .back-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212,165,53,0.15);
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-bar a {
      color: #D4A535;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s;
    }
    .back-bar a:hover { opacity: 0.7; }
    .lang-toggle {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 3px;
    }
    .lang-btn {
      padding: 4px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-family: inherit;
    }
    .lang-btn.active {
      background: #D4A535;
      color: #0A0A0F;
    }
    #root { min-height: 100vh; }
    input { font-family: inherit; }
    button { font-family: inherit; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div class="back-bar">
    <a href="event.html?id=dons-digitais-2026" id="backLink">&larr; Voltar ao Evento</a>
    <div class="lang-toggle">
      <button class="lang-btn" id="btnEn" onclick="switchLang('en')">EN</button>
      <button class="lang-btn active" id="btnPt" onclick="switchLang('pt')">PT</button>
    </div>
  </div>
  <div id="root"></div>

  <script>
    // Sync with site's language system
    var appLang = localStorage.getItem('fc-lang') || 'pt';
    function switchLang(lang) {
      appLang = lang;
      localStorage.setItem('fc-lang', lang);
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      document.getElementById('btnEn').classList.toggle('active', lang === 'en');
      document.getElementById('btnPt').classList.toggle('active', lang === 'pt');
      document.getElementById('backLink').innerHTML = lang === 'en' ? '&larr; Back to Event' : '&larr; Voltar ao Evento';
      // Tell React to re-render
      if (window.__setAppLang) window.__setAppLang(lang);
    }
    // Init toggle state on load
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('btnEn').classList.toggle('active', appLang === 'en');
      document.getElementById('btnPt').classList.toggle('active', appLang === 'pt');
      if (appLang === 'en') document.getElementById('backLink').innerHTML = '&larr; Back to Event';
    });
  </script>

  <script type="text/babel">
const { useState, useEffect } = React;

/* ============ COLORS ============ */
const GOLD = "#D4A535";
const GREEN = "#22C55E";
const RED = "#DC2626";
const BLUE = "#3B82F6";
const MUTED = "#8A8478";
const BG = "#0A0A0F";
const CARD = "#14141F";
const WHITE = "#F5F0E8";

/* ============ i18n helper ============ */
function t(lang, pt, en) { return lang === 'en' ? en : pt; }

/* ============ MAIN APP ============ */
function LogicJokes() {
  const [page, setPage] = useState(0);
  const [lang, setLang] = useState(window.appLang || 'pt');

  useEffect(() => {
    window.__setAppLang = setLang;
    return () => { window.__setAppLang = null; };
  }, []);

  const jokes = [JokeSoccer, JokeShopping, JokeMotherInLaw, JokeAdamEve, JokeFridge, JokeKids, JokeWhatsApp];
  const titles_pt = ["SE / E (IF / AND)", "OU (OR)", "CONTÉM (CONTAINS)", "DIFERENTE (!=)", "VAZIO / NÃO VAZIO", "OU (OR)", "SE / E (IF / AND)"];
  const titles_en = ["IF / AND", "OR", "CONTAINS", "NOT EQUAL (!=)", "EMPTY / NOT EMPTY", "OR", "IF / AND"];
  const titles = lang === 'en' ? titles_en : titles_pt;
  const emojis = ["⚽", "🛍️", "👵", "🍎", "🧊", "🤫", "📱"];
  const Current = jokes[page];

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(180deg, ${BG} 0%, #111118 100%)`, fontFamily: "'Inter', 'Segoe UI', system-ui, sans-serif", display: "flex", flexDirection: "column", alignItems: "center", padding: "1.5rem 1rem 6rem" }}>
      <div style={{ maxWidth: 540, width: "100%" }}>
        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: "1rem" }}>
          {jokes.map((_, i) => (
            <div key={i} onClick={() => setPage(i)} style={{ width: i === page ? 28 : 10, height: 10, borderRadius: 5, background: i === page ? GOLD : "#333", cursor: "pointer", transition: "all 0.3s ease" }} />
          ))}
        </div>
        <div style={{ textAlign: "center", marginBottom: "1.5rem" }}>
          <span style={{ color: GOLD, fontSize: "0.7rem", fontWeight: 700, letterSpacing: 3, textTransform: "uppercase" }}>{page + 1} {t(lang, "de", "of")} 7 · {t(lang, "Lógica de Programação", "Programming Logic")}</span>
          <h1 style={{ color: WHITE, fontSize: "1.5rem", fontWeight: 700, margin: "0.25rem 0 0" }}>{emojis[page]} {titles[page]}</h1>
        </div>
        <Current key={page} lang={lang} />
      </div>
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", justifyContent: "center", gap: "1rem", padding: "1rem", background: "linear-gradient(transparent, #0A0A0F 30%)", zIndex: 10 }}>
        <button disabled={page === 0} onClick={() => setPage(page - 1)} style={{ ...navBtn, opacity: page === 0 ? 0.3 : 1 }}>{t(lang, "← Anterior", "← Previous")}</button>
        <button disabled={page === jokes.length - 1} onClick={() => setPage(page + 1)} style={{ ...navBtn, background: GOLD, color: BG, opacity: page === jokes.length - 1 ? 0.3 : 1 }}>{t(lang, "Próximo →", "Next →")}</button>
      </div>
      <style>{`
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes glow { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
      `}</style>
    </div>
  );
}

const navBtn = { padding: "0.7rem 1.5rem", borderRadius: 10, border: `1px solid ${GOLD}`, background: "transparent", color: GOLD, fontSize: "0.95rem", fontWeight: 700, cursor: "pointer" };

/* ============ SHARED COMPONENTS ============ */

function PersonSays({ emoji, label, text, color = GREEN }) {
  return (
    <div style={{ marginBottom: "1.2rem" }}>
      <div style={{ color: GOLD, fontSize: "1rem", fontWeight: 700, marginBottom: "0.4rem" }}>{emoji} {label}</div>
      <div style={{ color: WHITE, fontSize: "1.15rem", fontWeight: 500, lineHeight: 1.5, background: `${color}10`, padding: "0.8rem 1.2rem", borderRadius: 14, border: `1px solid ${color}25`, borderLeft: `4px solid ${color}` }}>{text}</div>
    </div>
  );
}

function Check({ checked, onChange, label, text, accent = GREEN }) {
  return (
    <div onClick={onChange} style={{ display: "flex", alignItems: "center", gap: "0.8rem", padding: "0.8rem 1rem", background: checked ? `${accent}11` : CARD, borderRadius: 12, border: `2px solid ${checked ? accent : "rgba(212,165,53,0.2)"}`, cursor: "pointer", transition: "all 0.3s", userSelect: "none" }}>
      <div style={{ width: 32, height: 32, borderRadius: 8, border: `2px solid ${checked ? accent : "#555"}`, background: checked ? accent : "transparent", display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.25s", flexShrink: 0 }}>
        {checked && <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke={BG} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      <span style={{ background: checked ? GOLD : "#333", color: checked ? BG : "#888", padding: "0.15rem 0.55rem", borderRadius: 6, fontSize: "0.75rem", fontWeight: 800, letterSpacing: 1, transition: "all 0.3s", flexShrink: 0 }}>{label}</span>
      <span style={{ color: checked ? WHITE : MUTED, fontSize: "1.05rem", fontWeight: 500, transition: "color 0.3s" }}>{text}</span>
      <span style={{ marginLeft: "auto", fontSize: "1.3rem" }}>{checked ? "✅" : "⬜"}</span>
    </div>
  );
}

function OptionButton({ selected, onClick, label, emoji }) {
  return (
    <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: "0.8rem", padding: "0.9rem 1.2rem", background: selected ? `${GOLD}15` : CARD, borderRadius: 12, border: `2px solid ${selected ? GOLD : "rgba(212,165,53,0.2)"}`, cursor: "pointer", transition: "all 0.3s", userSelect: "none" }}>
      <span style={{ fontSize: "1.5rem" }}>{emoji}</span>
      <span style={{ color: selected ? WHITE : MUTED, fontSize: "1.05rem", fontWeight: 600, transition: "color 0.3s" }}>{label}</span>
      {selected && <span style={{ marginLeft: "auto", fontSize: "1.2rem" }}>👈</span>}
    </div>
  );
}

function Res({ emoji, text, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "0.6rem", padding: "0.5rem 0.7rem", background: "rgba(0,0,0,0.2)", borderRadius: 8 }}>
      <span style={{ fontSize: "1.3rem" }}>{emoji}</span>
      <span style={{ color, fontSize: "1rem", fontWeight: 600 }}>{text}</span>
    </div>
  );
}

function ResultBox({ color, header, children }) {
  return (
    <div style={{ background: `${color}10`, border: `1px solid ${color}40`, borderRadius: 14, padding: "1rem", display: "flex", flexDirection: "column", gap: "0.6rem", animation: "fadeUp 0.4s ease-out" }}>
      <div style={{ color, fontSize: "0.8rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: 2 }}>{header}</div>
      {children}
    </div>
  );
}

function RevealLogic({ children, lang }) {
  return (
    <div style={{ marginTop: "1.2rem", textAlign: "center", padding: "1rem", background: `linear-gradient(135deg, ${GOLD}18, ${GOLD}08)`, borderRadius: 14, border: `1px solid ${GOLD}40`, animation: "glow 0.6s ease-out" }}>
      <div style={{ color: GOLD, fontSize: "1.1rem", fontWeight: 700 }}>{t(lang, "☝️ Vocês acabaram de executar um programa!", "☝️ You just ran a program!")}</div>
      <div style={{ color: WHITE, fontSize: "1.15rem", fontWeight: 800, marginTop: "0.3rem" }}>{children}</div>
      <div style={{ color: MUTED, fontSize: "0.85rem", marginTop: "0.4rem" }}>{t(lang, "Isso É programação. Simples assim.", "That IS programming. Simple as that.")}</div>
    </div>
  );
}

function RealButton({ onClick, lang }) {
  return (
    <div style={{ textAlign: "center", marginTop: "1.5rem" }}>
      <button onClick={onClick} style={{ background: `linear-gradient(135deg, ${GREEN}, #166534)`, color: WHITE, border: "none", borderRadius: 12, padding: "1rem 2rem", fontSize: "1.05rem", fontWeight: 700, cursor: "pointer", boxShadow: `0 4px 24px ${GREEN}33` }}>
        {t(lang, "Agora veja um exemplo REAL →", "Now see a REAL example →")}
      </button>
    </div>
  );
}

function RealHeader({ tag, title, subtitle }) {
  return (
    <div style={{ textAlign: "center", marginBottom: "1.5rem", padding: "1rem", background: `${GREEN}10`, borderRadius: 14, border: `1px solid ${GREEN}30`, animation: "fadeUp 0.5s ease-out" }}>
      <div style={{ color: GREEN, fontSize: "0.7rem", fontWeight: 700, letterSpacing: 3, textTransform: "uppercase" }}>{tag}</div>
      <div style={{ color: WHITE, fontSize: "1.3rem", fontWeight: 700, marginTop: "0.3rem" }}>{title}</div>
      <div style={{ color: MUTED, fontSize: "0.85rem", marginTop: "0.2rem" }}>{subtitle}</div>
    </div>
  );
}

function ConnectionBox({ jokeLabel, jokeLogic, realLabel, realLogic, lang }) {
  return (
    <div style={{ marginTop: "1.5rem", textAlign: "center", padding: "1.2rem", background: `${GREEN}10`, borderRadius: 14, border: `1px solid ${GREEN}40`, animation: "glow 0.6s ease-out" }}>
      <div style={{ color: GREEN, fontSize: "1rem", fontWeight: 700 }}>{t(lang, "🧠 A mesma lógica!", "🧠 The same logic!")}</div>
      <div style={{ color: WHITE, fontSize: "1rem", fontWeight: 600, marginTop: "0.4rem", lineHeight: 1.6 }}>
        <span style={{ color: GOLD }}>{jokeLabel}:</span> {jokeLogic}
      </div>
      <div style={{ color: WHITE, fontSize: "1rem", fontWeight: 600, lineHeight: 1.6 }}>
        <span style={{ color: BLUE }}>{realLabel}:</span> {realLogic}
      </div>
      <div style={{ color: MUTED, fontSize: "0.85rem", marginTop: "0.6rem", fontStyle: "italic" }}>
        {t(lang, <>Apps, sites, sistemas... tudo funciona assim.<br />Vocês já entendem a lógica. Só falta falar com a IA.</>, <>Apps, websites, systems... they all work like this.<br />You already understand the logic. You just need to talk to the AI.</>)}
      </div>
    </div>
  );
}

function PromptReveal({ prompt, lang }) {
  return (
    <div style={{ marginTop: "2rem", animation: "fadeUp 0.5s ease-out" }}>
      <div style={{ textAlign: "center", marginBottom: "0.8rem" }}>
        <span style={{ background: GOLD, color: BG, padding: "0.3rem 1rem", borderRadius: 20, fontSize: "0.8rem", fontWeight: 800, letterSpacing: 2 }}>
          {t(lang, "💬 O PROMPT QUE CRIOU ISSO", "💬 THE PROMPT THAT CREATED THIS")}
        </span>
      </div>
      <div style={{ background: "#1a1a2e", borderRadius: 14, padding: "1.2rem 1.4rem", border: `1px solid ${GOLD}30`, position: "relative" }}>
        <div style={{ color: MUTED, fontSize: "0.75rem", fontWeight: 700, letterSpacing: 1, marginBottom: "0.6rem", textTransform: "uppercase" }}>
          {t(lang, "Eu escrevi isso pro Claude:", "I wrote this to Claude:")}
        </div>
        <div style={{ color: WHITE, fontSize: "0.95rem", lineHeight: 1.7, fontStyle: "italic" }}>
          "{prompt}"
        </div>
        <div style={{ marginTop: "1rem", textAlign: "center" }}>
          <div style={{ color: GOLD, fontSize: "1.1rem", fontWeight: 800 }}>
            {t(lang, "Só isso. A IA fez o resto. 🤯", "That's it. The AI did the rest. 🤯")}
          </div>
        </div>
      </div>
    </div>
  );
}

function HowButton({ onClick, lang }) {
  return (
    <div style={{ textAlign: "center", marginTop: "1.2rem" }}>
      <button onClick={onClick} style={{ background: `${GOLD}20`, color: GOLD, border: `1px solid ${GOLD}40`, borderRadius: 10, padding: "0.7rem 1.5rem", fontSize: "0.95rem", fontWeight: 700, cursor: "pointer" }}>
        {t(lang, "💬 Como eu criei isso? →", "💬 How did I create this? →")}
      </button>
    </div>
  );
}

function Divider() {
  return <div style={{ borderTop: `1px dashed ${GOLD}40`, margin: "0.3rem 0 1.2rem" }} />;
}

/* ====================================================
   JOKE 1: SOCCER — IF / AND
   ==================================================== */
function JokeSoccer({ lang }) {
  const [a, setA] = useState(false);
  const [b, setB] = useState(false);
  const [showReal, setShowReal] = useState(false);
  const [showPrompt, setShowPrompt] = useState(false);
  const [r1, setR1] = useState(false);
  const [r2, setR2] = useState(false);
  const both = a && b;
  const one = (a && !b) || (!a && b);
  const none = !a && !b;
  const bothR = r1 && r2;
  const oneR = (r1 && !r2) || (!r1 && r2);

  return (
    <>
      <PersonSays emoji="👩" label={t(lang, "Esposa diz:", "Wife says:")} text={t(lang, `"Você só vai no futebol HOJE..."`, `"You can only go to soccer TODAY..."`)} />
      <div style={{ display: "flex", flexDirection: "column", gap: "0.7rem", marginBottom: "1.5rem" }}>
        <Check checked={a} onChange={() => setA(!a)} label={t(lang, "SE", "IF")} text={t(lang, "preparar o jantar", "cook dinner")} />
        <Check checked={b} onChange={() => setB(!b)} label={t(lang, "E", "AND")} text={t(lang, "lavar a louça", "wash the dishes")} />
      </div>
      <Divider />
      {both && <ResultBox color={GREEN} header={t(lang, "✅ Resultado: TUDO feito", "✅ Result: ALL done")}><Res emoji="⚽" text={t(lang, "FUTEBOL COM OS AMIGOS!", "SOCCER WITH THE BOYS!")} color={GREEN} /><Res emoji="😍" text={t(lang, "Esposa: modo FELIZ", "Wife: HAPPY mode")} color={GREEN} /><Res emoji="🍺" text={t(lang, "Bônus: pode até levar petisco", "Bonus: you can even bring snacks")} color={GOLD} /></ResultBox>}
      {one && <ResultBox color={RED} header={t(lang, "⚠️ Resultado: Faltou...", "⚠️ Result: Missing...")}><Res emoji="🚫" text={t(lang, "NADA DE FUTEBOL", "NO SOCCER")} color={RED} /><Res emoji="😤" text={a ? t(lang, `"Fez o jantar mas não lavou a louça?!"`, `"You cooked but didn't wash the dishes?!"`) : t(lang, `"Lavou a louça mas e o jantar?!"`, `"You washed dishes but what about dinner?!"`)} color={RED} /><Res emoji="⚠️" text={t(lang, "Esposa: modo PERIGOSO", "Wife: DANGER mode")} color={RED} /></ResultBox>}
      {none && <ResultBox color={MUTED} header={t(lang, "😶 Resultado: Não fez nada", "😶 Result: Did nothing")}><Res emoji="🛋️" text={t(lang, "Sofá. Netflix. Que ELA escolhe.", "Couch. Netflix. SHE picks the show.")} color={MUTED} /><Res emoji="💀" text={t(lang, "Nível de perigo: MÁXIMO", "Danger level: MAXIMUM")} color={RED} /></ResultBox>}
      {both && !showReal && <><RevealLogic lang={lang}>{t(lang, "SE (condição 1) E (condição 2) → resultado", "IF (condition 1) AND (condition 2) → result")}</RevealLogic><RealButton onClick={() => setShowReal(true)} lang={lang} /></>}
      {showReal && !showPrompt && (
        <div style={{ marginTop: "2.5rem", animation: "fadeUp 0.6s ease-out" }}>
          <RealHeader tag={t(lang, "Mesma lógica · Uso real", "Same logic · Real use")} title={t(lang, "🏠 Sua casa se qualifica?", "🏠 Does your home qualify?")} subtitle={t(lang, "Programa de Eficiência Energética do Governo", "Government Energy Efficiency Program")} />
          <PersonSays emoji="🏛️" label={t(lang, "Governo diz:", "Government says:")} text={t(lang, `"Sua casa pode receber melhorias GRÁTIS..."`, `"Your home may receive FREE upgrades..."`)} color={BLUE} />
          <div style={{ display: "flex", flexDirection: "column", gap: "0.7rem", marginBottom: "1.5rem" }}>
            <Check checked={r1} onChange={() => setR1(!r1)} label={t(lang, "SE", "IF")} text={t(lang, "sua casa tem mais de 10 anos", "your home is over 10 years old")} accent={BLUE} />
            <Check checked={r2} onChange={() => setR2(!r2)} label={t(lang, "E", "AND")} text={t(lang, "conta de luz maior que $200/mês", "electric bill over $200/month")} accent={BLUE} />
          </div>
          <Divider />
          {bothR && <><ResultBox color={GREEN} header={t(lang, "✅ QUALIFICADO!", "✅ QUALIFIED!")}><Res emoji="🏠" text={t(lang, "Isolamento térmico GRÁTIS", "FREE thermal insulation")} color={GREEN} /><Res emoji="💡" text={t(lang, "Troca de lâmpadas e eletrodomésticos", "Bulb and appliance replacement")} color={GREEN} /><Res emoji="💰" text={t(lang, "Economia de até $1,200/ano", "Save up to $1,200/year")} color={GOLD} /></ResultBox><ConnectionBox lang={lang} jokeLabel={t(lang, "Esposa", "Wife")} jokeLogic={t(lang, "SE jantar E louça → futebol", "IF dinner AND dishes → soccer")} realLabel={t(lang, "Governo", "Government")} realLogic={t(lang, "SE casa velha E conta alta → programa grátis", "IF old house AND high bill → free program")} /><HowButton onClick={() => setShowPrompt(true)} lang={lang} /></>}
          {oneR && <ResultBox color={GOLD} header={t(lang, "⚠️ QUASE LÁ", "⚠️ ALMOST THERE")}><Res emoji="📋" text={t(lang, "Faltou um requisito", "Missing one requirement")} color={GOLD} /><Res emoji="📞" text={t(lang, "Ligue para verificar outros programas", "Call to check other programs")} color={MUTED} /></ResultBox>}
          {!r1 && !r2 && <ResultBox color={MUTED} header={t(lang, "📋 VERIFIQUE OS REQUISITOS", "📋 CHECK THE REQUIREMENTS")}><Res emoji="👆" text={t(lang, "Marque as condições acima", "Check the conditions above")} color={MUTED} /></ResultBox>}
        </div>
      )}
      {showPrompt && <PromptReveal lang={lang} prompt={t(lang, "Cria um app interativo que ensina IF/AND usando uma piada de casal — esposa diz que o marido só vai no futebol SE preparar o jantar E lavar a louça. Checkboxes bonitos, resultados diferentes com emojis. Depois mostra um exemplo real de qualificação pra programa do governo usando a mesma lógica. Estilo escuro com dourado e verde.", "Create an interactive app that teaches IF/AND using a couple joke — wife says husband can only go to soccer IF he cooks dinner AND washes dishes. Beautiful checkboxes, different results with emojis. Then show a real example of government program qualification using the same logic. Dark style with gold and green.")} />}
    </>
  );
}

/* ====================================================
   JOKE 2: SHOPPING — OR
   ==================================================== */
function JokeShopping({ lang }) {
  const [choice, setChoice] = useState(null);
  const [showReal, setShowReal] = useState(false);
  const [showPrompt, setShowPrompt] = useState(false);
  const [realChoice, setRealChoice] = useState(null);

  return (
    <>
